html,body{margin:0;height:100%;overflow:hidden}
body{font-family:"PT Root UI Web",Helvetica,Arial,sans-serif;background:#f2f1f0;color:#2d3137;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
.hidden{display:none!important}

/* рамка устройства (Figma: статус-бар 44, Safari-бар 50 снизу) */
#status{position:absolute;left:0;top:0;width:360px;height:44px;z-index:1250;pointer-events:none}
#safari{position:absolute;left:0;bottom:0;width:360px;height:131px;z-index:1400;pointer-events:none}
.view{position:absolute;left:0;right:0;top:44px;bottom:0}

/* ---------- SERP ---------- */
#serpScroll{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;padding-bottom:120px}
#serpScroll::-webkit-scrollbar{display:none}
.hdr{background:#fff}
.hdr .PopupControl_icon__njWnD{display:flex}
/* Figma: блок поиска и фильтров — НОВЫЙ элемент */
.sf{background:#f2f1f0;border-radius:0 0 12px 12px;padding:12px 8px 12px}
.sf-search{height:48px;background:#fff;border-radius:12px;position:relative;padding:4px 12px 0 40px}
.sf-search svg{position:absolute;left:12px;top:16px}
.sf-search b{display:block;font-weight:700;font-size:14px;line-height:20px;color:#2d3137}
.sf-search span{display:block;font-weight:480;font-size:14px;line-height:20px;color:#868686;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sf-chips{display:flex;gap:8px;margin-top:12px;overflow-x:auto;scrollbar-width:none;margin-right:-8px}
.sf-chips::-webkit-scrollbar{display:none}
.sf-fbtn{flex:0 0 32px;height:32px}
.sf-chip{flex:0 0 auto;height:32px;background:#fff;border-radius:12px;padding:6px 10px;font-weight:700;font-size:14px;line-height:20px;color:#2d3137;white-space:nowrap}
.list{display:flex;flex-direction:column;gap:12px;padding:4px 8px 0}
.list .HotelCard_content__FFlla{box-shadow:0 4px 12px rgba(0,0,0,.1);border-radius:12px}
.areachip{margin:4px 8px 4px;background:#E3EBFD;color:#0E41D2;border-radius:12px;padding:6px 12px;font-size:14px;line-height:20px;font-weight:480;display:flex;justify-content:space-between;align-items:center}
.areachip b{font-weight:700;cursor:pointer}
#areaSlot{position:sticky;top:0;z-index:20}
.areachip{transition:margin .22s ease,padding .22s ease,border-radius .22s ease,box-shadow .22s ease}
#areaSlot.stuck .areachip{margin:0 0 8px;padding:10px 20px;border-radius:0;box-shadow:0 4px 12px rgba(0,0,0,.08)}

/* Figma: кнопки «Карта» / «Список» — НОВЫЙ элемент */
.fbtn{position:absolute;left:50%;transform:translateX(-50%);bottom:66px;height:45px;border:0;border-radius:12px;background:#0d41d2;color:#fff;
  display:flex;align-items:center;gap:6px;padding:0 16px;font-family:inherit;font-weight:480;font-size:16px;line-height:22px;cursor:pointer;z-index:1100;white-space:nowrap}
.fbtn .n{background:rgba(255,255,255,.2);border-radius:8px;padding:0 6px;font-size:14px}

/* галерея: свайп фото */
.gal-track{display:flex;width:100%;height:100%;overflow-x:auto;touch-action:pan-y;cursor:grab;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal-track::-webkit-scrollbar{display:none}
.gal-track picture{flex:0 0 100%;height:100%;scroll-snap-align:start;display:block}
.gal-track img{display:block;-webkit-user-drag:none;pointer-events:none}
.HotelGallery_favorite___39Zl{pointer-events:auto}
.tz{position:absolute;top:0;bottom:0;width:35%;z-index:5}
.tz.l{left:0}.tz.r{right:0}
/* отзывы под рейтингом — из макета «Новая карточка на карте» */
.rv{display:flex;align-items:center;gap:3px;font-size:12px;line-height:16px;font-weight:480;color:#8f8e94;margin-top:4px;justify-content:flex-end}
.RightColumn_rating__Qac3q{flex-direction:column;align-items:flex-end;gap:0}

/* ---------- карта ---------- */
#map{position:absolute;inset:0;background:#e9e7e3}
.leaflet-container{font-family:inherit}
.leaflet-div-icon{background:none;border:0}
.mk{position:absolute;transform:translate(-50%,-100%);white-space:nowrap}
.HotelMarkerIcon_root__2aRo1{display:inline-flex;align-items:center;border:1px solid #e5e5e5;box-shadow:0 4px 12px rgba(0,0,0,.1);padding:4px 8px;cursor:pointer}

.HotelMarkerIcon_root_isHighlighted___kk_W .HotelMarker_guruPrice__ERItg{color:#fff}
.HotelMarker_root_isGuru__MHSG3{padding-left:28px}
.mtop{position:absolute;left:8px;right:8px;top:12px;z-index:1100;pointer-events:none}
.mtop > *{pointer-events:auto}
.mtop .sf-chips{margin-top:12px;margin-right:-8px}

.sf-row{display:flex;gap:8px}
.sf-row .sf-search{flex:1;min-width:0}
.sf-back{flex:none;width:auto;height:48px;padding:0 8px;border:0;border-radius:12px;background:#fff;color:#464A4F;display:flex;align-items:center;justify-content:center;cursor:pointer}
/* тач-режим (мышь как палец): без выделения текста, курсор — точка касания */
html.tch,html.tch *{cursor:none!important;-webkit-user-select:none;user-select:none;-webkit-user-drag:none}
#tdot{position:fixed;left:0;top:0;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:rgba(45,49,55,.18);border:1px solid rgba(45,49,55,.28);
  pointer-events:none;z-index:99999;transition:transform .12s ease,background .12s ease;display:none}
html.tch #tdot{display:block}
#tdot.down{transform:scale(.8);background:rgba(45,49,55,.32)}
.leaflet-right .leaflet-control-zoom{margin-right:8px}
.leaflet-top.leaflet-right{top:240px}
.Zoom_root__k81Rs a{display:flex!important;align-items:center;justify-content:center}

/* карточка на карте — Figma «19»: x8, низ на 8px выше Safari-бара, крестик 28 над карточкой */
.mcard{position:absolute;left:8px;right:8px;bottom:58px;z-index:1200}
.mcard .HotelCard_content__FFlla{box-shadow:0 4px 12px rgba(0,0,0,.1);border-radius:12px}
.mcard .HotelGallery_root__IhA4z{aspect-ratio:auto;height:126px}
.mcard .GalleryImage_item__zBL1Q{height:126px;object-fit:cover}
.mcard .HotelGallery_favorite___39Zl{display:flex;gap:8px}
.mclose{width:32px;height:32px;border-radius:8px;background:var(--palette-ulight,#f4f4f4);display:grid;place-items:center;cursor:pointer}

.strip .HotelGallery_root__IhA4z{aspect-ratio:auto;height:132px}

.sh-bar{position:absolute;left:156px;top:-10px;width:48px;height:4px;border-radius:100px;background:#fff}
.sheet.light .sh-bar{background:#c8c8c8;top:8px}
.sh-head{padding:20px 16px 12px;cursor:grab;touch-action:none}
.sh-head b{font-weight:700;font-size:16px;line-height:22px;color:#2d3137}
.sh-list{flex:1;overflow-y:auto;scrollbar-width:none;padding-bottom:120px}
.sh-list::-webkit-scrollbar{display:none}
.sh-list .list{padding-top:0}

.toast{position:absolute;left:50%;top:210px;transform:translate(-50%,-8px);background:#2d3137;color:#fff;padding:8px 14px;border-radius:12px;font-size:14px;line-height:20px;z-index:1500;opacity:0;transition:all .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:.95;transform:translate(-50%,0)}

  const out=[]; const N=[[55.7558,37.6173,.035,10],[55.7760,37.6560,.015,3],[55.7300,37.6400,.015,3],[55.7740,37.5820,.015,3],[55.7890,37.7480,.012,2],[55.7480,37.5370,.012,2],[55.8070,37.5800,.016,2],[55.7090,37.6560,.016,2],[55.7810,37.7130,.012,2],[55.7420,37.7040,.014,2],[55.8170,37.6380,.016,2],[55.7050,37.5800,.016,2],[55.6900,37.7300,.02,2],[55.8350,37.4900,.02,1],[55.7650,37.8350,.02,1],[55.6700,37.5500,.02,1],[55.8600,37.6600,.02,1],[55.6500,37.6400,.02,1]];
  const W=N.reduce((a,n)=>a+n[3],0);
  for(let i=0;i<300;i++){ let r=rnd()*W,n=N[0]; for(const x of N){ if((r-=x[3])<=0){n=x;break;} } out.push({ll:[n[0]+gauss()*n[2],n[1]+gauss()*n[2]*1.8],w:rnd()}); }
  return out; })();

function bindGallery(root){

    t.addEventListener('scroll',()=>{const i=Math.round(t.scrollLeft/t.clientWidth);dots.forEach((d,k)=>d.classList.toggle('DotsPagination_dot_active__YmMbn',k===i));});
    let d=null;
    t.addEventListener('pointerdown',e=>{e.stopPropagation(); if(e.button) return; d={x:e.clientX,y:e.clientY,s:t.scrollLeft,i:Math.round(t.scrollLeft/t.clientWidth),m:false,id:e.pointerId};});
    t.addEventListener('pointermove',e=>{ if(!d) return; const dx=e.clientX-d.x;
      if(!d.m){ if(Math.abs(dx)<6) return; if(Math.abs(e.clientY-d.y)>Math.abs(dx)){d=null;return;} d.m=true; t.setPointerCapture(d.id); t.style.scrollSnapType='none'; }
      const n=t.children.length-1, max=n*t.clientWidth; let v=d.s-dx; if(v<0) v=v/3; if(v>max) v=max+(v-max)/3; t.scrollLeft=v; e.preventDefault(); });
    const end=e=>{ if(!d) return; const m=d.m, dx=e.clientX-d.x, n=t.children.length-1; let i=d.i;
      if(m){ if(dx<-40) i=Math.min(n,d.i+1); else if(dx>40) i=Math.max(0,d.i-1);
        t.scrollTo({left:i*t.clientWidth,behavior:'smooth'}); setTimeout(()=>t.style.scrollSnapType='',350);
        t._drag=Date.now(); }
      d=null; };
    t.addEventListener('pointerup',end); t.addEventListener('pointercancel',end);
    t.addEventListener('click',e=>{ if(Date.now()-(t._drag||0)<300){e.stopPropagation();e.preventDefault();} },true);
    g.querySelectorAll('.tz').forEach(z=>z.addEventListener('click',e=>{e.stopPropagation();t.scrollBy({left:+z.dataset.tz*t.clientWidth,behavior:'smooth'});}));
  });
}

let map, markers={}, programmatic=false;
const groups=()=>{const m=new Map();H.forEach(h=>{const k=h.ll.join(',');if(!m.has(k))m.set(k,[]);m.get(k).push(h)});return [...m.entries()].map(([k,hs])=>({k,hs,ll:hs[0].ll}));};
const favPin=`<svg viewBox="-2 -2 24 24" width="20" height="20" style="display:block"><path fill="#cd1717" d="${Like.HP}"/></svg>`;
function markerHTML(g){
  const hs=g.hs, min=Math.min(...hs.map(h=>h.p)), isSel=S.group===g.k||hs.some(h=>h.id===S.sel), isFav=hs.some(h=>fav.has(h.id));
  if(hs.length>1){
    return `<a class="HotelMarkerIcon_root__2aRo1 HotelMarkerGroup_root__tgwGH ${isSel?'HotelMarkerIcon_root_isHighlighted___kk_W HotelMarkerGroup_root_isHighlighted__5SIDO':''} ${isFav?'HotelMarkerGroup_root_isFavorite__2QqBM':''}">${isFav?`<span class="HotelMarkerGroup_icon__4OoVl HotelMarkerGroup_icon_isFavorite__s_9qh">${favPin}</span>`:''}${hs.length} от ${rub(min)}</a>`;
  }
  const h=hs[0], guru=!!h.g;
  return `<a class="HotelMarkerIcon_root__2aRo1 HotelMarker_root__75tf6 ${guru?'HotelMarker_root_isGuru__MHSG3 HotelMarkerIcon_root_isGuru__X4oQZ':''} ${isSel?'HotelMarkerIcon_root_isHighlighted___kk_W HotelMarker_root_isHighlighted__viBUO':''} ${isFav?'HotelMarker_root_isFavorite__aPdst':''}">${isFav?`<span class="HotelMarker_icon__nlnBN HotelMarker_icon_isFavorite__dwMMV">${favPin}</span>`:''}${guru?`<span class="HotelMarker_icon__nlnBN HotelMarker_icon_isGuru__ZqBUs">${isSel?IC.guruHi:IC.guru}</span>`:''}${guru?`<span class="HotelMarker_guruPrice__ERItg">${rub(h.p)}</span>`:rub(h.p)}</a>`;
}
let layer=null;
const topN=(l,n)=>[...l].sort((a,b)=>prio(b)-prio(a)).slice(0,n);
const prio=h=>(h.top?3:0)+(h.g?1.5:0)+parseFloat(h.r.replace(',','.'))+(h.mock?0:2)+((h.id*7919)%13)/13;
const pinW=g=>(g.hs.some(h=>fav.has(h.id))?21:0)+(g.hs.length>1?30+String(g.hs.length).length*8+rub(Math.min(...g.hs.map(h=>h.p))).length*8.5:(g.hs[0].g?44:20)+rub(g.hs[0].p).length*8.5);
function drawMarkers(){
  if(!map) return;
  if(!layer) layer=L.layerGroup().addTo(map); layer.clearLayers(); markers={};
  const sz=map.getSize(), z=map.getZoom(), pad=60;
  const gs=groups().map(g=>({...g,pt:map.latLngToContainerPoint(g.ll),pr:Math.max(...g.hs.map(prio))+(g.hs.length>1?1:0)}))
    .filter(g=>g.pt.x>-pad&&g.pt.x<sz.x+pad&&g.pt.y>-pad&&g.pt.y<sz.y+pad);
  const forced=g=>S.group===g.k||g.hs.some(h=>h.id===S.sel||fav.has(h.id));
  gs.sort((a,b)=>(forced(b)-forced(a))||(b.pr-a.pr));
  // сколько цен помещается — растёт с зумом, как на проде
  const cap=Math.round(z<10.5?3:z<11.5?7:z<12.5?12:z<13.5?20:60);
  const boxes=[], pins=[], dots=[];
  const hit=b=>boxes.some(o=>b.x1<o.x2+4&&b.x2>o.x1-4&&b.y1<o.y2+3&&b.y2>o.y1-3);
  for(const g of gs){
    const w=pinW(g), b={x1:g.pt.x-w/2,x2:g.pt.x+w/2,y1:g.pt.y-34,y2:g.pt.y};
    const onScr=b.x1>2&&b.x2<sz.x-2&&b.y1>190&&b.y2<sz.y-Math.max(110,bottomReserve()-30);
    if(forced(g)||(onScr&&pins.length<cap&&!hit(b))){ boxes.push(b); pins.push(g); } else dots.push(g);
  }
  const dotIcon=L.divIcon({className:'',html:'<div class="HotelMarkerDot_root__K5H6e"></div>',iconSize:[0,0]});
  // фоновые точки: на мелком зуме прореживаем, под ценами не рисуем
  const keep=z<10.5?.25:z<11.5?.45:z<12.5?.7:1, taken=[];
  const free=p=>!boxes.some(o=>p.x>o.x1-2&&p.x<o.x2+2&&p.y>o.y1-2&&p.y<o.y2+4)&&!taken.some(q=>Math.abs(q.x-p.x)<7&&Math.abs(q.y-p.y)<7);
  for(const d of DOTS){ if(d.w>keep) continue; const p=map.latLngToContainerPoint(d.ll); if(p.x<-20||p.x>sz.x+20||p.y<-20||p.y>sz.y+20||!free(p)) continue; taken.push(p); L.marker(d.ll,{interactive:false,icon:dotIcon}).addTo(layer); }
  for(const g of dots){ const p=g.pt; if(!free(p)) continue; taken.push(p); const m=L.marker(g.ll,{icon:dotIcon}).addTo(layer); m.on('click',()=>tapGroup(g.k)); }
  for(const g of pins){ const html=`<div class="mk">${markerHTML(g)}</div>`;
    const m=L.marker(g.ll,{icon:L.divIcon({className:'',html,iconSize:[0,0]}),zIndexOffset:forced(g)?1000:Math.round(g.pr*10)}).addTo(layer);
    m.on('click',()=>tapGroup(g.k)); markers[g.k]=m; }
}

  L.tileLayer('https://tiles.fastrovok.net/api/v1/t/ostrovok/ru/{z}/{x}/{y}.png',{maxZoom:18}).addTo(map);
  const z=L.control.zoom({position:'topright',zoomInText:IC.plus,zoomOutText:IC.minus}); z.addTo(map); z.getContainer().classList.add('Zoom_root__k81Rs');

/* «Назад»: к исходному списку — область карты не применяется (S.area сброшен), шторки закрыты, прокрутка списка как была.
   «Список» (ниже) — наоборот, открывает список отелей из области карты с тем же числом, что на кнопке */
$('btnBack').onclick=()=>{ S.area=null; S.sel=null; S.group=null; S.sheet=null;
  $('sheet').classList.add('hidden'); $('dim').classList.add('hidden');
  $('mapView').classList.add('hidden'); $('serp').classList.remove('hidden'); renderSerp(); setListBtn();
  $('serpScroll').scrollTop=serpY; };
$('btnList').onclick=()=>{ if(V==='C'){ setSheet('peek'); return; } showSerp(); };

/* ---------- тач-режим: мышь ведёт себя как палец (для показа на десктопе) ----------
   протягивание скроллит ленты и списки (с инерцией), после протягивания клик не срабатывает; карта (Leaflet), галерея и шторка — своими обработчиками */
(function(){
  if(!matchMedia('(pointer:fine)').matches) return;  // настоящий тач — ничего не эмулируем
  document.documentElement.classList.add('tch');
  const dot=document.createElement('div'); dot.id='tdot'; document.body.appendChild(dot);
  addEventListener('pointermove',e=>{ dot.style.left=e.clientX+'px'; dot.style.top=e.clientY+'px'; },{passive:true});
  addEventListener('pointerdown',()=>dot.classList.add('down')); addEventListener('pointerup',()=>dot.classList.remove('down'));
  document.documentElement.addEventListener('mouseleave',()=>dot.style.left='-99px');
  addEventListener('dragstart',e=>e.preventDefault());
  const canY=el=>{const o=getComputedStyle(el).overflowY;return (o==='auto'||o==='scroll')&&el.scrollHeight>el.clientHeight+1;};
  const canX=el=>{const o=getComputedStyle(el).overflowX;return (o==='auto'||o==='scroll')&&el.scrollWidth>el.clientWidth+1;};
  let d=null, raf=0, dragged=0, p0=null;  // p0 — любое нажатие: протянули дальше 6px → клик гасим (и после свайпа фото)
  addEventListener('pointerdown',e=>{  // window/capture: доходит и с фото галереи (у неё свой stopPropagation)
    if(e.pointerType!=='mouse'||e.button) return;
    p0={x:e.clientX,y:e.clientY,m:false};
    if(e.target.closest('.leaflet-container')&&!e.target.closest('#mapBottom,#sheet,.mtop')) return;  // карту тянет Leaflet
    if(e.target.closest('#shHead')) return;
    cancelAnimationFrame(raf);
    let ys=null, xs=null;
    for(let el=e.target; el&&el!==document.body; el=el.parentElement){ if(!ys&&canY(el)) ys=el; if(!xs&&canX(el)) xs=el; }
    if(!ys&&!xs) return;
    d={gal:!!e.target.closest('.gal-track'),x:e.clientX,y:e.clientY,ys,xs,ax:null,el:null,v:0,t:performance.now(),p:0,id:e.pointerId};
  },true);
  addEventListener('pointermove',e=>{
    if(p0&&!p0.m&&Math.hypot(e.clientX-p0.x,e.clientY-p0.y)>6) p0.m=true;
    if(!d) return;
    const dx=e.clientX-d.x, dy=e.clientY-d.y;
    if(!d.ax){ if(Math.hypot(dx,dy)<6) return;
      d.ax = Math.abs(dy)>=Math.abs(dx) ? (d.ys?'y':null) : (d.xs&&!d.gal?'x':null);  // фото листает сама галерея
      if(!d.ax){ d=null; return; }
      d.el = d.ax==='y'?d.ys:d.xs; d.s = d.ax==='y'?d.el.scrollTop:d.el.scrollLeft; d.el.style.scrollBehavior='auto'; d.sn=d.el.style.scrollSnapType; d.el.style.scrollSnapType='none'; }
    const pos = d.ax==='y'?e.clientY:e.clientX, now=performance.now();
    if(d.p) d.v = (pos-d.p)/Math.max(1,now-d.t)*0.8 + d.v*0.2;
    d.p=pos; d.t=now;
    const off = d.ax==='y'?dy:dx;
    if(d.ax==='y') d.el.scrollTop=d.s-off; else d.el.scrollLeft=d.s-off;
  },{passive:true});
  const end=()=>{
    if(p0&&p0.m&&!(document.querySelector('.leaflet-dragging'))) dragged=performance.now(); p0=null;
    if(!d) return; const k=d; d=null; if(!k.ax) return;
    dragged=performance.now();
    let v=-k.v*16;  // px за кадр
    const step=()=>{ if(Math.abs(v)<0.4){ k.el.style.scrollSnapType=k.sn||''; return; }
      if(k.ax==='y') k.el.scrollTop+=v; else k.el.scrollLeft+=v; v*=0.95; raf=requestAnimationFrame(step); };
    if(performance.now()-k.t>80) v=0;  // остановили палец — без инерции
    raf=requestAnimationFrame(step);
  };
  addEventListener('pointerup',end,true); addEventListener('pointercancel',end,true);
  addEventListener('click',e=>{ if(performance.now()-dragged<250){ e.stopPropagation(); e.preventDefault(); } },true);
})();

renderSerp(); setListBtn();
if(V==='C'){ showMap(); setTimeout(()=>{ S.area=visible().map(h=>h.id); areaSheet(); setSheet('half'); },50); }
</script>
</body>
